# Railway + GitHub: config-as-code (https://docs.railway.com/config-as-code)
# Use Railpack (FrankenPHP + Laravel defaults). Do not add a root Dockerfile unless it
# includes a real app server—Railway always prefers Dockerfile over Railpack when present.

[build]
builder = "RAILPACK"

[deploy]
healthcheckPath = "/up"
healthcheckTimeout = 120
# Migrations run in railway/init-app.sh (pre-deploy). Skip Railpack's duplicate migrate on boot.
# Set the same variable in the Railway dashboard if config-as-code is not applied.
